<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" role="img" aria-labelledby="title desc"><title id="title">Claude Code 기능 지도</title><desc id="desc">학습 순서에 따라 11개 기능을 3단계로 나누고 회사 업무에 비유한 그림</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="404" rx="12"/><text class="h" x="380" y="36" text-anchor="middle" dominant-baseline="central">Claude Code 기능 지도: 회사 업무에 비유하면</text><g class="green"><rect x="20" y="78" width="110" height="50" rx="8" stroke-width="1"/><text class="t" x="75.0" y="103.0" text-anchor="middle" dominant-baseline="central">1단계 기초</text></g><g class="green"><rect x="150" y="70" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="220.0" y="94.0" text-anchor="middle" dominant-baseline="central">1장 슬래시 명령</text><text class="s" x="220.0" y="115.0" text-anchor="middle" dominant-baseline="central">자주 쓰는 단축키</text></g><g class="green"><rect x="302" y="70" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="372.0" y="94.0" text-anchor="middle" dominant-baseline="central">2장 메모리</text><text class="s" x="372.0" y="115.0" text-anchor="middle" dominant-baseline="central">업무 인수인계 노트</text></g><g class="green"><rect x="454" y="70" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="524.0" y="94.0" text-anchor="middle" dominant-baseline="central">8장 체크포인트</text><text class="s" x="524.0" y="115.0" text-anchor="middle" dominant-baseline="central">게임 세이브 포인트</text></g><g class="green"><rect x="606" y="70" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="676.0" y="94.0" text-anchor="middle" dominant-baseline="central">10장 CLI 기초</text><text class="s" x="676.0" y="115.0" text-anchor="middle" dominant-baseline="central">명령 창 리모컨</text></g><g class="blue"><rect x="20" y="178" width="110" height="50" rx="8" stroke-width="1"/><text class="t" x="75.0" y="203.0" text-anchor="middle" dominant-baseline="central">2단계 자동화</text></g><g class="blue"><rect x="150" y="170" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="220.0" y="194.0" text-anchor="middle" dominant-baseline="central">3장 스킬</text><text class="s" x="220.0" y="215.0" text-anchor="middle" dominant-baseline="central">업무 매뉴얼</text></g><g class="blue"><rect x="302" y="170" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="372.0" y="194.0" text-anchor="middle" dominant-baseline="central">6장 훅</text><text class="s" x="372.0" y="215.0" text-anchor="middle" dominant-baseline="central">자동 알림 규칙</text></g><g class="blue"><rect x="454" y="170" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="524.0" y="194.0" text-anchor="middle" dominant-baseline="central">5장 MCP</text><text class="s" x="524.0" y="215.0" text-anchor="middle" dominant-baseline="central">외부 서비스 연결선</text></g><g class="blue"><rect x="606" y="170" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="676.0" y="194.0" text-anchor="middle" dominant-baseline="central">4장 서브에이전트</text><text class="s" x="676.0" y="215.0" text-anchor="middle" dominant-baseline="central">업무를 나눌 팀원</text></g><g class="red"><rect x="20" y="278" width="110" height="50" rx="8" stroke-width="1"/><text class="t" x="75.0" y="303.0" text-anchor="middle" dominant-baseline="central">3단계 고급</text></g><g class="red"><rect x="150" y="270" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="220.0" y="294.0" text-anchor="middle" dominant-baseline="central">9장 고급 기능</text><text class="s" x="220.0" y="315.0" text-anchor="middle" dominant-baseline="central">계획서와 권한 관리</text></g><g class="red"><rect x="302" y="270" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="372.0" y="294.0" text-anchor="middle" dominant-baseline="central">7장 플러그인</text><text class="s" x="372.0" y="315.0" text-anchor="middle" dominant-baseline="central">도구 상자 세트</text></g><g class="red"><rect x="454" y="270" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="524.0" y="294.0" text-anchor="middle" dominant-baseline="central">10장 CLI 심화</text><text class="s" x="524.0" y="315.0" text-anchor="middle" dominant-baseline="central">CI 자동 실행</text></g><text class="s" x="380" y="380" text-anchor="middle" dominant-baseline="central">왼쪽 위부터 오른쪽 아래 순서로 공부하면 됩니다</text></svg>
