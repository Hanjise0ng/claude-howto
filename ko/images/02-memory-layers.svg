<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-labelledby="title desc"><title id="title">메모리 파일의 종류</title><desc id="desc">개인, 팀, 로컬, 파일별 규칙 메모리 파일과 자동 메모리가 Claude에게 합쳐져 읽히는 구조</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="346" rx="12"/><text class="h" x="380" y="30" text-anchor="middle" dominant-baseline="central">메모리 파일의 종류: 모두 합쳐서 읽어요</text><g class="gray"><rect x="30" y="60" width="460" height="50" rx="8" stroke-width="1"/><text class="m" x="50" y="85" dominant-baseline="central">~/.claude/CLAUDE.md</text><text class="s" x="470" y="85" text-anchor="end" dominant-baseline="central">나 · 내 모든 프로젝트</text></g><path class="ln" d="M492 85 C 515 85, 515 155, 536 155" marker-end="url(#a)"/><g class="purple"><rect x="30" y="122" width="460" height="50" rx="8" stroke-width="1"/><text class="m" x="50" y="147" dominant-baseline="central">./CLAUDE.md</text><text class="s" x="470" y="147" text-anchor="end" dominant-baseline="central">팀 · 이 프로젝트 · Git 공유</text></g><path class="ln" d="M492 147 C 515 147, 515 155, 536 155" marker-end="url(#a)"/><g class="gray"><rect x="30" y="184" width="460" height="50" rx="8" stroke-width="1"/><text class="m" x="50" y="209" dominant-baseline="central">./CLAUDE.local.md</text><text class="s" x="470" y="209" text-anchor="end" dominant-baseline="central">나 · 이 프로젝트 · Git 제외</text></g><path class="ln" d="M492 209 C 515 209, 515 155, 536 155" marker-end="url(#a)"/><g class="purple"><rect x="30" y="246" width="460" height="50" rx="8" stroke-width="1"/><text class="m" x="50" y="271" dominant-baseline="central">./.claude/rules/*.md</text><text class="s" x="470" y="271" text-anchor="end" dominant-baseline="central">팀 · 특정 파일을 다룰 때만</text></g><path class="ln" d="M492 271 C 515 271, 515 155, 536 155" marker-end="url(#a)"/><g class="teal"><rect x="540" y="115" width="190" height="80" rx="8" stroke-width="1"/><text class="t" x="635.0" y="144.5" text-anchor="middle" dominant-baseline="central">Claude</text><text class="s" x="635.0" y="165.5" text-anchor="middle" dominant-baseline="central">대화 시작 때 함께 읽음</text></g><g class="coral"><rect x="540" y="236" width="190" height="60" rx="8" stroke-width="1"/><text class="t" x="635.0" y="255.5" text-anchor="middle" dominant-baseline="central">자동 메모리</text><text class="s" x="635.0" y="276.5" text-anchor="middle" dominant-baseline="central">Claude가 스스로 적는 노트</text></g><line class="dash" x1="635" y1="236" x2="635" y2="199"/><text class="s" x="380" y="326" text-anchor="middle" dominant-baseline="central">보라색 = 팀과 공유 (Git) · 회색 = 나만 쓰는 설정</text></svg>
