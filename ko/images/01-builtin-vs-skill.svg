<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="title desc"><title id="title">기본 명령과 스킬 비교</title><desc id="desc">기본 명령 5개 목록과, 스킬 폴더 구조가 명령 이름이 되는 방식을 비교한 그림</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="350" rx="12"/><text class="h" x="380" y="36" text-anchor="middle" dominant-baseline="central">슬래시 명령은 크게 두 가지</text><g class="gray"><rect x="30" y="64" width="335" height="236" rx="12" stroke-width="1"/></g><text class="t" x="197" y="92" text-anchor="middle" dominant-baseline="central">기본 명령: 스마트폰 기본 앱</text><text class="s" x="197" y="116" text-anchor="middle" dominant-baseline="central">설치하자마자 들어 있음</text><text class="m" x="80" y="146" text-anchor="start" dominant-baseline="central">/help</text><text class="s" x="200" y="146" text-anchor="start" dominant-baseline="central">도움말</text><text class="m" x="80" y="176" text-anchor="start" dominant-baseline="central">/clear</text><text class="s" x="200" y="176" text-anchor="start" dominant-baseline="central">새 대화</text><text class="m" x="80" y="206" text-anchor="start" dominant-baseline="central">/compact</text><text class="s" x="200" y="206" text-anchor="start" dominant-baseline="central">대화 요약</text><text class="m" x="80" y="236" text-anchor="start" dominant-baseline="central">/model</text><text class="s" x="200" y="236" text-anchor="start" dominant-baseline="central">모델 변경</text><text class="m" x="80" y="266" text-anchor="start" dominant-baseline="central">/rewind</text><text class="s" x="200" y="266" text-anchor="start" dominant-baseline="central">되돌리기</text><g class="purple"><rect x="395" y="64" width="335" height="236" rx="12" stroke-width="1"/></g><text class="t" x="562" y="92" text-anchor="middle" dominant-baseline="central">스킬: 내가 만든 단축어</text><text class="s" x="562" y="116" text-anchor="middle" dominant-baseline="central">폴더와 파일 하나로 직접 만듦</text><text class="m" x="420" y="146" text-anchor="start" dominant-baseline="central">.claude/</text><text class="m" x="420" y="170" text-anchor="start" dominant-baseline="central">└─ skills/</text><text class="m" x="420" y="194" text-anchor="start" dominant-baseline="central">   ├─ explain/</text><text class="m" x="420" y="218" text-anchor="start" dominant-baseline="central">   │   └─ SKILL.md  → /explain</text><text class="m" x="420" y="242" text-anchor="start" dominant-baseline="central">   └─ find-bug/</text><text class="m" x="420" y="266" text-anchor="start" dominant-baseline="central">       └─ SKILL.md  → /find-bug</text><text class="s" x="380" y="326" text-anchor="middle" dominant-baseline="central">처음에는 기본 명령 5개만 외우고, 반복되는 부탁이 생기면 스킬로 만드세요</text></svg>
