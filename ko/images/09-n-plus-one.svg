<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" role="img" aria-labelledby="title desc"><title id="title">N+1 문제</title><desc id="desc">게시글 목록 조회 시 작성자와 댓글을 따로 조회해 select가 6번 실행되는 경우와 한 번에 가져와 1번으로 줄인 경우 비교</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="366" rx="12"/><text class="h" x="380" y="30" text-anchor="middle" dominant-baseline="central">N+1 문제: 목록 1번 + 연관 데이터 N번</text><g class="coral"><rect x="30" y="56" width="335" height="270" rx="12" stroke-width="1"/></g><text class="t" x="197.5" y="80" text-anchor="middle" dominant-baseline="central">지금: select 6번</text><g class="gray"><rect x="55" y="92" width="285" height="40" rx="8" stroke-width="1"/><text class="t" x="197.5" y="112.0" text-anchor="middle" dominant-baseline="central">select 게시글 목록 (1번)</text></g><g class="coral"><rect x="85" y="142" width="255" height="28" rx="8" stroke-width="1"/><text class="t" x="212.5" y="156.0" text-anchor="middle" dominant-baseline="central">select 작성자 1</text></g><g class="coral"><rect x="85" y="176" width="255" height="28" rx="8" stroke-width="1"/><text class="t" x="212.5" y="190.0" text-anchor="middle" dominant-baseline="central">select 작성자 2</text></g><g class="coral"><rect x="85" y="210" width="255" height="28" rx="8" stroke-width="1"/><text class="t" x="212.5" y="224.0" text-anchor="middle" dominant-baseline="central">select 댓글 (1번 글)</text></g><g class="coral"><rect x="85" y="244" width="255" height="28" rx="8" stroke-width="1"/><text class="t" x="212.5" y="258.0" text-anchor="middle" dominant-baseline="central">select 댓글 (2번 글)</text></g><g class="coral"><rect x="85" y="278" width="255" height="28" rx="8" stroke-width="1"/><text class="t" x="212.5" y="292.0" text-anchor="middle" dominant-baseline="central">select 댓글 (3번 글)</text></g><g class="teal"><rect x="395" y="56" width="335" height="270" rx="12" stroke-width="1"/></g><text class="t" x="562.5" y="80" text-anchor="middle" dominant-baseline="central">개선: select 1번</text><g class="green"><rect x="420" y="150" width="285" height="64" rx="8" stroke-width="1"/><text class="t" x="562.5" y="173.0" text-anchor="middle" dominant-baseline="central">select 게시글 + 작성자 + 댓글</text><text class="s" x="562.5" y="194.0" text-anchor="middle" dominant-baseline="central">한 번에 함께 가져오기</text></g><text class="s" x="562" y="250" text-anchor="middle" dominant-baseline="central">@EntityGraph / fetch join</text><text class="s" x="380" y="346" text-anchor="middle" dominant-baseline="central">게시글이 100개라면? 왼쪽은 최대 201번, 오른쪽은 여전히 1번</text></svg>
