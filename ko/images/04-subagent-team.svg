<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-labelledby="title desc"><title id="title">서브에이전트 팀 구조</title><desc id="desc">메인 Claude가 Explore, 보안 리뷰어, 코드 리뷰어 서브에이전트에게 일을 나눠 맡기는 구조</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="304" rx="12"/><text class="h" x="380" y="30" text-anchor="middle" dominant-baseline="central">메인 Claude는 팀장, 서브에이전트는 전문가</text><g class="purple"><rect x="260" y="56" width="240" height="60" rx="8" stroke-width="1"/><text class="t" x="380.0" y="77.0" text-anchor="middle" dominant-baseline="central">메인 Claude (팀장)</text><text class="s" x="380.0" y="98.0" text-anchor="middle" dominant-baseline="central">일을 나누고 결과를 합침</text></g><g class="teal"><rect x="50" y="196" width="200" height="60" rx="8" stroke-width="1"/><text class="t" x="150.0" y="217.0" text-anchor="middle" dominant-baseline="central">Explore</text><text class="s" x="150.0" y="238.0" text-anchor="middle" dominant-baseline="central">코드 검색 · 읽기 전용</text></g><line class="ln" x1="320" y1="118" x2="150" y2="194" marker-end="url(#a)"/><g class="teal"><rect x="280" y="196" width="200" height="60" rx="8" stroke-width="1"/><text class="t" x="380.0" y="217.0" text-anchor="middle" dominant-baseline="central">security-reviewer</text><text class="s" x="380.0" y="238.0" text-anchor="middle" dominant-baseline="central">보안 리뷰 · 읽기 전용</text></g><line class="ln" x1="380" y1="118" x2="380" y2="194" marker-end="url(#a)"/><g class="teal"><rect x="510" y="196" width="200" height="60" rx="8" stroke-width="1"/><text class="t" x="610.0" y="217.0" text-anchor="middle" dominant-baseline="central">spring-