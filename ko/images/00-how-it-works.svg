<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" width="720" height="342" role="img" aria-labelledby="title desc"><title id="title">Claude Code의 동작 방식</title><desc id="desc">사용자가 부탁하면 Claude Code가 파일 읽기, 계획, 수정과 실행, 결과 확인을 반복한 뒤 보고하는 그림</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="720" height="342" rx="12"/><text class="h" x="360" y="36" text-anchor="middle" dominant-baseline="central">Claude Code는 이렇게 일합니다</text><g class="gray"><rect x="40" y="70" width="140" height="66" rx="8" stroke-width="1"/><text class="t" x="110.0" y="94.0" text-anchor="middle" dominant-baseline="central">나</text><text class="s" x="110.0" y="115.0" text-anchor="middle" dominant-baseline="central">할 일을 말로 부탁</text></g><line class="ln" x1="184" y1="103" x2="236" y2="103" marker-end="url(#a)"/><g class="purple"><rect x="240" y="60" width="300" height="220" rx="12" stroke-width="1"/></g><text class="t" x="390" y="82" text-anchor="middle" dominant-baseline="central">Claude Code (일하는 AI 동료)</text><g class="gray"><rect x="270" y="95" width="240" height="30" rx="8" stroke-width="1"/><text class="t" x="390.0" y="110.0" text-anchor="middle" dominant-baseline="central">1. 파일 읽기</text></g><g class="gray"><rect x="270" y="135" width="240" height="30" rx="8" stroke-width="1"/><text class="t" x="390.0" y="150.0" text-anchor="middle" dominant-baseline="central">2. 계획 세우기</text></g><g class="gray"><rect x="270" y="175" width="240" height="30" rx="8" stroke-width="1"/><text class="t" x="390.0" y="190.0" text-anchor="middle" dominant-baseline="central">3. 코드 수정 · 명령 실행</text></g><g class="gray"><rect x="270" y="215" width="240" height="30" rx="8" stroke-width="1"/><text class="t" x="390.0" y="230.0" text-anchor="middle" dominant-baseline="central">4. 결과 확인</text></g><path class="ln" d="M512 230 H526 V110 H514" marker-end="url(#a)"/><text class="s" x="390" y="266" text-anchor="middle" dominant-baseline="central">끝날 때까지 1~4를 반복</text><line class="ln" x1="544" y1="170" x2="586" y2="170" marker-end="url(#a)"/><g class="teal"><rect x="590" y="128" width="110" height="84" rx="8" stroke-width="1"/><text class="t" x="645.0" y="161.0" text-anchor="middle" dominant-baseline="central">내 프로젝트</text><text class="s" x="645.0" y="182.0" text-anchor="middle" dominant-baseline="central">파일 · 터미널</text></g><line class="ln" x1="240" y1="250" x2="184" y2="250" marker-end="url(#a)"/><g class="gray"><rect x="40" y="220" width="140" height="60" rx="8" stroke-width="1"/><text class="t" x="110.0" y="241.0" text-anchor="middle" dominant-baseline="central">결과 보고</text><text class="s" x="110.0" y="262.0" text-anchor="middle" dominant-baseline="central">바꾼 내용 설명</text></g><text class="s" x="360" y="318" text-anchor="middle" dominant-baseline="central">채팅 AI와 다른 점: 직접 파일을 열고, 고치고, 실행까지 합니다</text></svg>
