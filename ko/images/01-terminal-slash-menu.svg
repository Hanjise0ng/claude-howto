<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 354" width="740" height="354" role="img" aria-labelledby="title desc"><title id="title">슬래시 명령 목록 화면 예시</title><desc id="desc">터미널에서 슬래시를 입력했을 때 기본 명령과 직접 만든 스킬이 함께 보이는 화면을 그린 예시</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="740" height="354" rx="12"/><text class="h" x="370" y="32" text-anchor="middle" dominant-baseline="central">화면 예시 그림: / 를 입력하면 명령 목록이 뜹니다</text><g class="term"><rect x="30" y="56" width="680" height="250" rx="10" stroke-width="1"/><circle cx="54" cy="76" r="5" fill="#E24B4A"/><circle cx="72" cy="76" r="5" fill="#EF9F27"/><circle cx="90" cy="76" r="5" fill="#639922"/><text class="s" x="56" y="112" text-anchor="start" dominant-baseline="central">~/board-api</text><text class="m" x="56" y="142" text-anchor="start" dominant-baseline="central">&gt; /</text><text class="m" x="76" y="174" text-anchor="start" dominant-baseline="central">/clear</text><text class="s" x="220" y="174" text-anchor="start" dominant-baseline="central">Clear conversation history</text><text class="m" x="76" y="198" text-anchor="start" dominant-baseline="central">/compact</text><text class="s" x="220" y="198" text-anchor="start" dominant-baseline="central">Compact conversation</text><text class="m" x="76" y="222" text-anchor="start" dominant-baseline="central">/explain</text><text class="s" x="220" y="222" text-anchor="start" dominant-baseline="central">(project) 코드를 신입 눈높이로 설명</text><text class="m" x="76" y="246" text-anchor="start" dominant-baseline="central">/help</text><text class="s" x="220" y="246" text-anchor="start" dominant-baseline="central">Show help</text><text class="m" x="76" y="270" text-anchor="start" dominant-baseline="central">/model</text><text class="s" x="220" y="270" text-anchor="start" dominant-baseline="central">Select model</text></g><rect x="66" y="210" width="610" height="24" rx="4" fill="none" stroke="#7F77DD" stroke-width="1.5"/><text class="s" x="370" y="330" text-anchor="middle" dominant-baseline="central">보라색 테두리: 내가 만든 스킬도 같은 목록에 함께 나타납니다 (실제 화면과 글자는 조금 다를 수 있어요)</text></svg>
