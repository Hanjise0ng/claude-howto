<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-labelledby="title desc"><title id="title">대화형 모드와 출력 모드 비교</title><desc id="desc">대화를 주고받는 대화형 모드와 파이프로 입력을 받아 한 번 답하고 끝나는 출력 모드를 비교한 그림</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="334" rx="12"/><text class="h" x="380" y="30" text-anchor="middle" dominant-baseline="central">대화형 모드와 출력 모드</text><g class="gray"><rect x="30" y="56" width="335" height="236" rx="12" stroke-width="1"/></g><text class="t" x="197.5" y="80" text-anchor="middle" dominant-baseline="central">대화형: claude</text><g class="purple"><rect x="55" y="92" width="285" height="36" rx="8" stroke-width="1"/><text class="t" x="197.5" y="110.0" text-anchor="middle" dominant-baseline="central">나: 검색 API 개선점 알려 줘</text></g><g class="teal"><rect x="55" y="138" width="285" height="36" rx="8" stroke-width="1"/><text class="t" x="197.5" y="156.0" text-anchor="middle" dominant-baseline="central">Claude: 세 가지가 있어요...</text></g><g class="purple"><rect x="55" y="184" width="285" height="36" rx="8" stroke-width="1"/><text class="t" x="197.5" y="202.0" text-anchor="middle" dominant-baseline="central">나: 첫 번째만 진행해 줘</text></g><g class="teal"><rect x="55" y="230" width="285" height="36" rx="8" stroke-width="1"/><text class="t" x="197.5" y="248.0" text-anchor="middle" dominant-baseline="central">Claude: 수정했어요</text></g><g class="gray"><rect x="395" y="56" width="335" height="236" rx="12" stroke-width="1"/></g><text class="t" x="562.5" y="80" text-anchor="middle" dominant-baseline="central">출력 모드: claude -p</text><g class="gray"><rect x="420" y="92" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="562.5" y="105.0" text-anchor="middle" dominant-baseline="central">cat error.log</text><text class="s" x="562.5" y="126.0" text-anchor="middle" dominant-baseline="central">앞 명령의 출력</text></g><line class="ln" x1="562" y1="138" x2="562" y2="156" marker-end="url(#a)"/><g class="purple"><rect x="420" y="160" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="562.5" y="173.0" text-anchor="middle" dominant-baseline="central">| claude -p "원인 분석"</text><text class="s" x="562.5" y="194.0" text-anchor="middle" dominant-baseline="central">한 번 묻기</text></g><line class="ln" x1="562" y1="206" x2="562" y2="224" marker-end="url(#a)"/><g class="teal"><rect x="420" y="228" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="562.5" y="241.0" text-anchor="middle" dominant-baseline="central">답 출력 후 끝</text><text class="s" x="562.5" y="262.0" text-anchor="middle" dominant-baseline="central">화면 또는 파일로</text></g><text class="s" x="380" y="314" text-anchor="middle" dominant-baseline="central">대화형은 함께 일할 때, 출력 모드는 스크립트 · 로그 분석 · CI에서</text></svg>
