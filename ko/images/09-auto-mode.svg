<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" width="760" height="274" role="img" aria-labelledby="title desc"><title id="title">auto 모드의 안전 검사기</title><desc id="desc">Claude의 행동이 훅과 안전 검사기를 거쳐 바로 진행되거나 차단되는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="274" rx="12"/><text class="h" x="380" y="30" text-anchor="middle" dominant-baseline="central">auto 모드: 안전 검사기가 지켜보는 자동 진행</text><g class="purple"><rect x="30" y="110" width="150" height="60" rx="8" stroke-width="1"/><text class="t" x="105.0" y="131.0" text-anchor="middle" dominant-baseline="central">Claude의 행동</text><text class="s" x="105.0" y="152.0" text-anchor="middle" dominant-baseline="central">수정 · 명령 · 요청</text></g><line class="ln" x1="182" y1="140" x2="206" y2="140" marker-end="url(#a)"/><g class="amber"><rect x="210" y="110" width="150" height="60" rx="8" stroke-width="1"/><text class="t" x="285.0" y="131.0" text-anchor="middle" dominant-baseline="central">훅 (6장)</text><text class="s" x="285.0" y="152.0" text-anchor="middle" dominant-baseline="central">내가 정한 규칙</text></g><line class="ln" x1="362" y1="140" x2="386" y2="140" marker-end="url(#a)"/><g class="amber"><rect x="390" y="110" width="150" height="60" rx="8" stroke-width="1"/><text class="t" x="465.0" y="131.0" text-anchor="middle" dominant-baseline="central">안전 검사기</text><text class="s" x="465.0" y="152.0" text-anchor="middle" dominant-baseline="central">위험한지 판단</text></g><path class="ln" d="M542 130 L 570 130 L 570 90 L 586 90" marker-end="url(#a)"/><path class="ln" d="M542 150 L 570 150 L 570 190 L 586 190" marker-end="url(#a)"/><g class="green"><rect x="590" y="62" width="150" height="56" rx="8" stroke-width="1"/><text class="t" x="665.0" y="81.0" text-anchor="middle" dominant-baseline="central">바로 진행</text><text class="s" x="665.0" y="102.0" text-anchor="middle" dominant-baseline="central">파일 수정 등</text></g><g class="red"><rect x="590" y="162" width="150" height="56" rx="8" stroke-width="1"/><text class="t" x="665.0" y="181.0" text-anchor="middle" dominant-baseline="central">차단</text><text class="s" x="665.0" y="202.0" text-anchor="middle" dominant-baseline="central">강제 푸시 · 운영 배포</text></g><text class="s" x="380" y="254" text-anchor="middle" dominant-baseline="central">끝나면 꼭 /diff 로 검토해요. auto는 '검토 없이 믿어도 됨'이 아니에요</text></svg>
