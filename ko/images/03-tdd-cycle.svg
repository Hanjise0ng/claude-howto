<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" width="760" height="254" role="img" aria-labelledby="title desc"><title id="title">테스트 먼저 쓰기 흐름</title><desc id="desc">실패하는 테스트 작성, 최소 수정으로 통과, 정리의 세 단계를 반복하는 TDD 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="254" rx="12"/><text class="h" x="380" y="30" text-anchor="middle" dominant-baseline="central">테스트 먼저 쓰고 고치기 (TDD)</text><g class="red"><rect x="40" y="66" width="200" height="70" rx="8" stroke-width="1"/><text class="t" x="140.0" y="92.0" text-anchor="middle" dominant-baseline="central">1. Red</text><text class="s" x="140.0" y="113.0" text-anchor="middle" dominant-baseline="central">실패하는 테스트 먼저</text></g><g class="green"><rect x="280" y="66" width="200" height="70" rx="8" stroke-width="1"/><text class="t" x="380.0" y="92.0" text-anchor="middle" dominant-baseline="central">2. Green</text><text class="s" x="380.0" y="113.0" text-anchor="middle" dominant-baseline="central">통과하는 최소 수정</text></g><line class="ln" x1="243" y1="101.0" x2="276" y2="101.0" marker-end="url(#a)"/><g class="blue"><rect x="520" y="66" width="200" height="70" rx="8" stroke-width="1"/><text class="t" x="620.0" y="92.0" text-anchor="middle" dominant-baseline="central">3. Refactor</text><text class="s" x="620.0" y="113.0" text-anchor="middle" dominant-baseline="central">테스트 유지하며 정리</text></g><line class="ln" x1="483" y1="101.0" x2="516" y2="101.0" marker-end="url(#a)"/><path class="ln" d="M580 140 V 170 H 140 V 140" marker-end="url(#a)"/><text class="s" x="360" y="190" text-anchor="middle" dominant-baseline="central">다음 버그 · 다음 기능에서 반복</text><text class="s" x="380" y="234" text-anchor="middle" dominant-baseline="central">테스트가 처음부터 통과하면? → 버그를 제대로 재현하지 못한 거예요</text></svg>
