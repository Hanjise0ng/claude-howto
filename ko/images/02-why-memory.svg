<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" role="img" aria-labelledby="title desc"><title id="title">메모리가 없을 때와 있을 때</title><desc id="desc">같은 규칙을 매일 반복해야 하는 경우와 CLAUDE.md에 한 번 적어 두는 경우를 비교한 그림</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>.bg{fill:#FFFFFF}.t{font:500 15px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.s{font:400 13px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#5F5E5A}.h{font:500 18px Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#2C2C2A}.m{font:400 13px 'D2Coding', Consolas, 'Courier New', monospace;fill:#2C2C2A}.ln{stroke:#888780;stroke-width:1.2;fill:none}.dash{stroke:#888780;stroke-width:1;fill:none;stroke-dasharray:4 4}.term>rect{fill:#1E1E1E;stroke:#444441}.term>.m{fill:#E8E6DE}.term>.s{fill:#B4B2A9}.hl{fill:#3C3489}.ok{fill:#5DCAA5}.arrowhead{fill:#888780}.gray>rect{fill:#F1EFE8;stroke:#888780}.gray>.t{fill:#2C2C2A}.gray>.s{fill:#5F5E5A}.purple>rect{fill:#EEEDFE;stroke:#534AB7}.purple>.t{fill:#26215C}.purple>.s{fill:#534AB7}.teal>rect{fill:#E1F5EE;stroke:#0F6E56}.teal>.t{fill:#04342C}.teal>.s{fill:#0F6E56}.coral>rect{fill:#FAECE7;stroke:#993C1D}.coral>.t{fill:#4A1B0C}.coral>.s{fill:#993C1D}.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>.t{fill:#173404}.green>.s{fill:#3B6D11}.blue>rect{fill:#E6F1FB;stroke:#185FA5}.blue>.t{fill:#042C53}.blue>.s{fill:#185FA5}.red>rect{fill:#FCEBEB;stroke:#A32D2D}.red>.t{fill:#501313}.red>.s{fill:#A32D2D}.amber>rect{fill:#FAEEDA;stroke:#854F0B}.amber>.t{fill:#412402}.amber>.s{fill:#854F0B}@media (prefers-color-scheme: dark){.bg{fill:#1A1A19}.t,.h,.m{fill:#F1EFE8}.s{fill:#B4B2A9}.ln,.dash{stroke:#B4B2A9}.arrowhead{fill:#B4B2A9}.gray>rect{fill:#2C2C2A;stroke:#B4B2A9}.gray>.t{fill:#F1EFE8}.gray>.s{fill:#D3D1C7}.purple>rect{fill:#3C3489;stroke:#AFA9EC}.purple>.t{fill:#EEEDFE}.purple>.s{fill:#CECBF6}.teal>rect{fill:#085041;stroke:#5DCAA5}.teal>.t{fill:#E1F5EE}.teal>.s{fill:#9FE1CB}.coral>rect{fill:#712B13;stroke:#F0997B}.coral>.t{fill:#FAECE7}.coral>.s{fill:#F5C4B3}.green>rect{fill:#27500A;stroke:#97C459}.green>.t{fill:#EAF3DE}.green>.s{fill:#C0DD97}.blue>rect{fill:#0C447C;stroke:#85B7EB}.blue>.t{fill:#E6F1FB}.blue>.s{fill:#B5D4F4}.red>rect{fill:#791F1F;stroke:#F09595}.red>.t{fill:#FCEBEB}.red>.s{fill:#F7C1C1}.amber>rect{fill:#633806;stroke:#EF9F27}.amber>.t{fill:#FAEEDA}.amber>.s{fill:#FAC775}}</style><rect class="bg" width="760" height="306" rx="12"/><text class="h" x="380" y="30" text-anchor="middle" dominant-baseline="central">CLAUDE.md는 신입에게 주는 인수인계 노트</text><g class="gray"><rect x="30" y="56" width="335" height="230" rx="12" stroke-width="1"/></g><text class="t" x="197.5" y="80" text-anchor="middle" dominant-baseline="central">메모리가 없으면</text><g class="gray"><rect x="55" y="96" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="197.5" y="118.0" text-anchor="middle" dominant-baseline="central">1일차: 테스트 이름은 한글로!</text></g><g class="gray"><rect x="55" y="156" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="197.5" y="178.0" text-anchor="middle" dominant-baseline="central">2일차: 테스트 이름은 한글로!</text></g><g class="coral"><rect x="55" y="216" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="197.5" y="238.0" text-anchor="middle" dominant-baseline="central">3일차: 또 말해야 해요...</text></g><g class="teal"><rect x="395" y="56" width="335" height="230" rx="12" stroke-width="1"/></g><text class="t" x="562.5" y="80" text-anchor="middle" dominant-baseline="central">CLAUDE.md가 있으면</text><g class="purple"><rect x="420" y="96" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="562.5" y="118.0" text-anchor="middle" dominant-baseline="central">CLAUDE.md에 한 번 작성</text></g><g class="purple"><rect x="420" y="156" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="562.5" y="178.0" text-anchor="middle" dominant-baseline="central">대화마다 자동으로 먼저 읽음</text></g><line class="ln" x1="562" y1="142" x2="562" y2="154" marker-end="url(#a)"/><g class="green"><rect x="420" y="216" width="285" height="44" rx="8" stroke-width="1"/><text class="t" x="562.5" y="238.0" text-anchor="middle" dominant-baseline="central">말하지 않아도 규칙을 지킴</text></g><line class="ln" x1="562" y1="202" x2="562" y2="214" marker-end="url(#a)"/></svg>
