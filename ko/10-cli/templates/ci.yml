# PR이 올라오거나 main에 푸시되면 빌드와 테스트를 실행한다.
# 복사 위치: .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Windows에서 커밋하면 gradlew의 실행 권한이 빠질 수 있어서 먼저 켜 준다.
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build
